<!doctype html>
<html lang="es">
<link rel="stylesheet" href="./styles.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detectives del pH</title>
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="laboratorio">
    <header class="cabecera">
      <span class="simbolo" aria-hidden="true">pH</span>
      <h1 data-texto="titulo">Detectives del pH</h1>
    </header>

    <section id="inicio" class="panel">
      <h2 id="selector" tabindex="-1" data-texto="idioma"></h2>
      <div class="botones idiomas">
        <button type="button" data-idioma="es" lang="es">Español</button>
        <button type="button" data-idioma="en" lang="en">English</button>
      </div>

      <p data-texto="intro"></p>

      <div class="modos">
        <button class="modo" type="button" data-modo="practica">
          <strong data-texto="practica"></strong>
          <span data-texto="detallePractica"></span>
        </button>
        <button class="modo" type="button" data-modo="reto">
          <strong data-texto="reto"></strong>
          <span data-texto="detalleReto"></span>
        </button>
      </div>

      <button class="secundario" type="button" data-guia data-texto="guia"></button>
    </section>

    <section id="juego" hidden>
      <div class="estado">
        <span id="modo-actual"></span>
        <label id="contador" for="progreso"></label>
      </div>
      <progress id="progreso" max="6" value="0"></progress>

      <article id="ficha" class="panel ficha">
        <h2 id="pista" tabindex="-1"></h2>

        <div id="medidor" class="medidor" aria-hidden="true" hidden>
          <span>pH</span>
          <strong id="lectura"></strong>
        </div>

        <div id="tornasol" class="tornasol" hidden></div>

        <div id="ayudas" class="ayudas" hidden>
          <div class="botones">
            <button id="pedir-pista" type="button"
              aria-controls="texto-pista" aria-expanded="false"
              data-texto="verPista"></button>
            <button type="button" data-guia data-texto="guia"></button>
          </div>
          <p id="texto-pista" class="nota" hidden></p>
        </div>

        <p id="pregunta" data-texto="pregunta"></p>
        <div class="botones opciones" role="group" aria-labelledby="pregunta">
          <button type="button" data-respuesta="acida"></button>
          <button type="button" data-respuesta="neutra"></button>
          <button type="button" data-respuesta="basica"></button>
        </div>

        <p id="feedback" class="feedback" role="status" aria-atomic="true"></p>
        <button id="siguiente" class="principal" type="button" hidden></button>
      </article>
    </section>

    <section id="final" class="panel" hidden>
      <h2 id="fin-titulo" tabindex="-1" data-texto="fin"></h2>
      <p id="resumen" class="resumen"></p>

      <button id="revisar" type="button" aria-controls="revision"
        aria-expanded="false" data-texto="revisar"></button>

      <div id="revision" class="revision" hidden>
        <ol id="errores"></ol>
      </div>

      <div class="acciones botones">
        <button id="reiniciar" class="principal" type="button"
          data-texto="reiniciar"></button>
        <button id="cambiar-idioma" type="button" data-texto="cambiar"></button>
        <a id="encuesta" class="boton" target="_blank" rel="noopener"
          data-texto="encuesta" hidden></a>
      </div>
    </section>
  </main>

  <dialog id="guia" aria-labelledby="guia-titulo">
    <form method="dialog">
      <h2 id="guia-titulo" data-texto="guia"></h2>
      <p data-texto="guiaPh"></p>

      <div class="escala">
        <span class="acido" data-texto="escalaAcida"></span>
        <span class="neutro" data-texto="escalaNeutra"></span>
        <span class="basico" data-texto="escalaBasica"></span>
      </div>

      <p data-texto="guiaTornasol"></p>
      <button class="principal" type="submit" autofocus data-texto="cerrar"></button>
    </form>
  </dialog>
</body>
</html>
