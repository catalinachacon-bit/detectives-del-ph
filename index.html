<!doctype html>
<html lang="es">
<link rel="stylesheet" href="./styles.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detectives del pH</title>
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="laboratorio">
    <header class="encabezado">
      <span class="simbolo" aria-hidden="true">pH</span>
      <h1 id="titulo">Detectives del pH</h1>
    </header>

    <section id="inicio" class="panel" aria-labelledby="selector">
      <h2 id="selector" tabindex="-1">
        Elige tu idioma / <span lang="en">Choose your language</span>
      </h2>

      <div class="idiomas">
        <button type="button" data-idioma="es" lang="es" aria-pressed="true">
          Español
        </button>
        <button type="button" data-idioma="en" lang="en" aria-pressed="false">
          English
        </button>
      </div>

      <p id="instrucciones"></p>
      <button id="empezar" class="principal" type="button"></button>
    </section>

    <section id="juego" hidden>
      <div class="estado">
        <label for="progreso" id="contador"></label>
        <span id="puntaje"></span>
      </div>
      <progress id="progreso" value="0" max="6"></progress>

      <article id="ficha" class="panel ficha">
        <h2 id="pista" tabindex="-1"></h2>
        <div id="tornasol" class="tornasol" hidden></div>
        <p id="pregunta"></p>

        <div class="opciones">
          <button type="button" data-respuesta="acida"></button>
          <button type="button" data-respuesta="neutra"></button>
          <button type="button" data-respuesta="basica"></button>
        </div>

        <p id="feedback" class="feedback" role="status" aria-atomic="true"></p>
        <button id="siguiente" class="principal" type="button" hidden></button>
      </article>
    </section>

    <section id="final" class="panel" hidden>
      <h2 id="resultado" tabindex="-1"></h2>
      <div class="acciones">
        <button id="reiniciar" class="principal" type="button"></button>
        <button id="cambiar-idioma" type="button"></button>
        <a id="encuesta" class="boton" target="_blank" rel="noopener" hidden></a>
      </div>
    </section>
  </main>
</body>
</html>
