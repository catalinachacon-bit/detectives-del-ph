<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="./styles.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detectives del pH</title>
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="laboratorio">
    <header class="encabezado">
      <div class="simbolo" aria-hidden="true">pH</div>
      <h1>Detectives del pH</h1>
    </header>

    <section id="inicio" class="panel">
      <h2>Tu misión de laboratorio</h2>
      <p>Analiza seis soluciones acuosas a 25 °C. Usa el medidor de pH
        y el papel tornasol para decidir si cada muestra es ácida,
        neutra o básica.</p>
      <button id="empezar" class="principal" type="button">Empezar</button>
    </section>

    <section id="juego" hidden>
      <div class="estado">
        <label for="progreso" id="contador"></label>
        <span id="puntaje"></span>
      </div>
      <progress id="progreso" value="0" max="6"></progress>

      <article id="ficha" class="panel ficha">
        <h2 id="pista" tabindex="-1"></h2>
        <div id="tornasol" class="tornasol" hidden></div>

        <p>¿Cómo clasificarías esta muestra?</p>
        <div id="opciones" class="opciones">
          <button type="button" data-respuesta="Ácida">Ácida</button>
          <button type="button" data-respuesta="Neutra">Neutra</button>
          <button type="button" data-respuesta="Básica">Básica</button>
        </div>

        <p id="feedback" class="feedback" role="status" aria-atomic="true"></p>
        <button id="siguiente" class="principal" type="button" hidden>
          Siguiente muestra
        </button>
      </article>
    </section>

    <section id="final" class="panel" hidden>
      <h2 id="resultado" tabindex="-1"></h2>
      <div class="acciones">
        <button id="reiniciar" class="principal" type="button">Volver a jugar</button>
        <a id="encuesta" class="boton" target="_blank" rel="noopener" hidden>
          Evalúa el juego
        </a>
      </div>
    </section>
  </main>
</body>
</html>
